name: Telegram Bot

'on':
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Start bot
        env:
          env:
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: python bot.py
